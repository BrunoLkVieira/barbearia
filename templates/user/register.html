{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Orbly Barber</title>
    <link rel="shortcut icon" href="{% static 'geral/img/logo.ico' %}" type="image/x-icon">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Adicionando SweetAlert2 para os popups nativos no frontend -->
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="{% static 'geral/css/desktop/style.css' %}">
    <link rel="stylesheet" href="{% static 'user/css/desktop/login.css' %}">
    
    <link rel="stylesheet" href="{% static 'geral/css/mobile/style.css' %}">
    <link rel="stylesheet" href="{% static 'user/css/mobile/login.css' %}">
    
    <style>
        .register-container {
            max-width: 500px;
            margin: 40px auto;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .register-header {
            background: linear-gradient(135deg, #1a233a, #0d1322);
            padding: 30px 20px;
            text-align: center;
            color: #fff;
        }

        .register-body { padding: 30px; }
        
        /* Grid para alinhar Nome e Sobrenome lado a lado */
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        
        @media (max-width: 820px) {
            .register-container { margin: 15px; border-radius: 12px; }
            .form-grid { grid-template-columns: 1fr; gap: 0; }
            .register-body { padding: 20px; }
        }
    </style>
</head>
<body style="background-color: #f5f7fa; display: flex; align-items: center; justify-content: center; min-height: 100vh;">
    
    <div class="register-container" style="width: 100%;">
        <div class="register-header">
            
            <div class="logo" style="margin-bottom: 15px; display: flex; justify-content: center;">
                <div class="logo-icon">
                    <img src="https://i.ibb.co/G3WqN7N1/logo-barbearia-Photoroom.png" alt="logo do sistema" class="logo-image">
                </div>
            </div>
            
            <h1 style="margin: 0; font-size: 1.8rem; font-weight: 800;">Crie sua Conta Orbly</h1>
            <p style="margin: 10px 0 0 0; color: #a0aec0; font-size: 0.9rem;">Gerencie sua barbearia de forma profissional</p>
        </div>
        
        <div class="register-body">
            {% if messages %}
                {% for message in messages %}
                    {% if message.tags == 'error' %}
                        <div class="alert alert-{{ message.tags }}" style="background: #fee2e2; color: #c53030; padding: 15px; border-radius: 8px; margin-bottom: 20px; border-left: 4px solid #e53e3e;">
                            <i class="fas fa-exclamation-circle"></i> {{ message }}
                        </div>
                    {% endif %}
                {% endfor %}
            {% endif %}

            <form id="registerForm" method="POST" action="{% url 'user:register' %}" autocomplete="off">
                {% csrf_token %}
                
                <div class="form-grid">
                    <div class="form-group" style="margin-bottom: 15px;">
                        <label class="form-label" style="display: block; margin-bottom: 5px; font-weight: 600; color: #2c3e50;">Nome <span style="color: #e53e3e;">*</span></label>
                        <input type="text" name="name" class="form-control" style="width: 100%; padding: 12px; border: 1px solid #dcdde1; border-radius: 8px; background: #f8f9fa; box-sizing: border-box;" required>
                    </div>
                    <div class="form-group" style="margin-bottom: 15px;">
                        <label class="form-label" style="display: block; margin-bottom: 5px; font-weight: 600; color: #2c3e50;">Sobrenome <span style="color: #e53e3e;">*</span></label>
                        <input type="text" name="last_name" class="form-control" style="width: 100%; padding: 12px; border: 1px solid #dcdde1; border-radius: 8px; background: #f8f9fa; box-sizing: border-box;" required>
                    </div>
                </div>

                <div class="form-group" style="margin-bottom: 15px;">
                    <label class="form-label" style="display: block; margin-bottom: 5px; font-weight: 600; color: #2c3e50;">E-mail de Acesso <span style="color: #e53e3e;">*</span></label>
                    <input type="email" name="email" class="form-control" placeholder="seu@email.com" style="width: 100%; padding: 12px; border: 1px solid #dcdde1; border-radius: 8px; background: #f8f9fa; box-sizing: border-box;" required>
                </div>

                <div class="form-group" style="margin-bottom: 15px;">
                    <label class="form-label" style="display: block; margin-bottom: 5px; font-weight: 600; color: #2c3e50;">Documento da Barbearia (Opcional)</label>
                    <div style="display: flex; border: 1px solid #dcdde1; border-radius: 8px; overflow: hidden; background: #f8f9fa;">
                        <select name="document_type" id="docTypeSelect" style="border: none; background: #eaecef; padding: 12px; font-weight: 700; color: #2c3e50; outline: none; cursor: pointer; border-right: 1px solid #dcdde1;">
                            <option value="CPF">CPF</option>
                            <option value="CNPJ">CNPJ</option>
                        </select>
                        <input type="text" name="document" id="docInput" style="flex: 1; border: none; padding: 12px; outline: none; background: transparent; color: #2c3e50; box-sizing: border-box;" placeholder="000.000.000-00">
                    </div>
                </div>

                <div class="form-group" style="margin-bottom: 15px;">
                    <label class="form-label" style="display: block; margin-bottom: 5px; font-weight: 600; color: #2c3e50;">WhatsApp Comercial</label>
                    <input type="tel" name="phone" maxlength="15" class="form-control" placeholder="(00) 00000-0000" style="width: 100%; padding: 12px; border: 1px solid #dcdde1; border-radius: 8px; background: #f8f9fa; box-sizing: border-box;">
                </div>

                <div class="form-grid">
                    <div class="form-group" style="margin-bottom: 15px; position: relative;">
                        <label class="form-label" style="display: block; margin-bottom: 5px; font-weight: 600; color: #2c3e50;">Criar Senha <span style="color: #e53e3e;">*</span></label>
                        <input type="password" id="password1" name="password1" class="form-control" minlength="6" style="width: 100%; padding: 12px; padding-right: 40px; border: 1px solid #dcdde1; border-radius: 8px; background: #f8f9fa; box-sizing: border-box;" required>
                        <i class="fas fa-eye toggle-password" data-target="password1" style="position: absolute; right: 15px; bottom: 14px; cursor: pointer; color: #7f8c8d; font-size: 1.1rem;"></i>
                    </div>
                    <div class="form-group" style="margin-bottom: 25px; position: relative;">
                        <label class="form-label" style="display: block; margin-bottom: 5px; font-weight: 600; color: #2c3e50;">Confirmar Senha <span style="color: #e53e3e;">*</span></label>
                        <input type="password" id="password2" name="password2" class="form-control" minlength="6" style="width: 100%; padding: 12px; padding-right: 40px; border: 1px solid #dcdde1; border-radius: 8px; background: #f8f9fa; box-sizing: border-box;" required>
                        <i class="fas fa-eye toggle-password" data-target="password2" style="position: absolute; right: 15px; bottom: 14px; cursor: pointer; color: #7f8c8d; font-size: 1.1rem;"></i>
                    </div>
                </div>

                <button class="btn-login" type="submit" style="width: 100%; padding: 15px; background: linear-gradient(135deg, #FF7A00, #d35400); color: white; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 4px 15px rgba(255, 122, 0, 0.3);">
                    <i class="fas fa-check-circle"></i> Criar Minha Conta
                </button>

                <div style="text-align: center; margin-top: 25px;">
                    <p style="color: #7f8c8d; font-size: 0.9rem;">Já possui uma conta? <a href="{% url 'user:login' %}" style="color: #FF7A00; font-weight: 700; text-decoration: none;">Faça login aqui.</a></p>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            
            // 1. Alternância de visibilidade da senha (Eye Icon)
            document.querySelectorAll('.toggle-password').forEach(icon => {
                icon.addEventListener('click', function() {
                    const targetId = this.getAttribute('data-target');
                    const input = document.getElementById(targetId);
                    
                    if (input.type === 'password') {
                        input.type = 'text';
                        this.classList.remove('fa-eye');
                        this.classList.add('fa-eye-slash');
                        this.style.color = '#FF7A00'; // Feedback visual de que está exposto
                    } else {
                        input.type = 'password';
                        this.classList.remove('fa-eye-slash');
                        this.classList.add('fa-eye');
                        this.style.color = '#7f8c8d';
                    }
                });
            });

            // 2. Máscara Inteligente de CPF/CNPJ
            const docTypeSelect = document.getElementById('docTypeSelect');
            const docInput = document.getElementById('docInput');

            function applyMask() {
                let v = docInput.value.replace(/\D/g, ''); 
                
                if (docTypeSelect.value === 'CPF') {
                    if (v.length > 11) v = v.slice(0, 11);
                    v = v.replace(/(\d{3})(\d)/, '$1.$2');
                    v = v.replace(/(\d{3})(\d)/, '$1.$2');
                    v = v.replace(/(\d{3})(\d{1,2})$/, '$1-$2');
                } else {
                    if (v.length > 14) v = v.slice(0, 14);
                    v = v.replace(/^(\d{2})(\d)/, '$1.$2');
                    v = v.replace(/^(\d{2})\.(\d{3})(\d)/, '$1.$2.$3');
                    v = v.replace(/\.(\d{3})(\d)/, '.$1/$2');
                    v = v.replace(/(\d{4})(\d)/, '$1-$2');
                }
                docInput.value = v;
            }

            if(docTypeSelect && docInput) {
                docTypeSelect.addEventListener('change', function() {
                    docInput.value = ''; 
                    if (this.value === 'CPF') {
                        docInput.placeholder = '000.000.000-00';
                        docInput.setAttribute('maxlength', '14');
                    } else {
                        docInput.placeholder = '00.000.000/0001-00';
                        docInput.setAttribute('maxlength', '18');
                    }
                });
                docInput.addEventListener('input', applyMask);
            }

            const phoneInput = document.querySelector('input[name="phone"]');
            if (phoneInput) {
                phoneInput.setAttribute('maxlength', '15'); 
                phoneInput.addEventListener('input', function (e) {
                    let x = e.target.value.replace(/\D/g, '').match(/(\d{0,2})(\d{0,5})(\d{0,4})/);
                    e.target.value = !x[2] ? x[1] : '(' + x[1] + ') ' + x[2] + (x[3] ? '-' + x[3] : '');
                });
            }

            // 3. Submissão Assíncrona com SweetAlert2 (Sem recarregar a tela em caso de erro)
            const registerForm = document.getElementById('registerForm');
            registerForm.addEventListener('submit', function(e) {
                e.preventDefault(); 
                
                // UX: Muda texto do botão para indicar carregamento
                const submitBtn = this.querySelector('button[type="submit"]');
                const originalBtnText = submitBtn.innerHTML;
                submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processando...';
                submitBtn.disabled = true;

                const formData = new FormData(this);

                fetch(this.action, {
                    method: 'POST',
                    body: formData,
                    headers: {
                        'X-Requested-With': 'XMLHttpRequest'
                    }
                })
                .then(response => response.json())
                .then(data => {
                    submitBtn.innerHTML = originalBtnText;
                    submitBtn.disabled = false;

                    if (!data.success) {
                        // Exibe Erro, tela permanece igual para o usuário consertar
                        Swal.fire({
                            icon: 'error',
                            title: 'Falha no Cadastro',
                            text: data.message,
                            confirmButtonColor: '#1a233a',
                            confirmButtonText: 'Corrigir Dados'
                        });
                    } else {
                        // Sucesso, bloqueia form e joga pro Login
                        Swal.fire({
                            icon: 'success',
                            title: 'Sucesso!',
                            text: data.message,
                            showConfirmButton: false,
                            timer: 2500
                        }).then(() => {
                            window.location.href = "{% url 'user:login' %}"; 
                        });
                    }
                })
                .catch(error => {
                    console.error('Fetch Error:', error);
                    submitBtn.innerHTML = originalBtnText;
                    submitBtn.disabled = false;
                    Swal.fire({
                        icon: 'error',
                        title: 'Erro de Conexão',
                        text: 'Ocorreu um erro ao comunicar com o servidor. Tente novamente.',
                        confirmButtonColor: '#1a233a'
                    });
                });
            });
        });
    </script>
</body>
</html>
