{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Orbly Barber</title>
    <link rel="shortcut icon" href="{% static 'geral/img/logo.ico' %}" type="image/x-icon">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="{% static 'geral/css/desktop/style.css' %}">
    <link rel="stylesheet" href="{% static 'user/css/desktop/login.css' %}">
    
    <link rel="stylesheet" href="{% static 'geral/css/mobile/style.css' %}">
    <link rel="stylesheet" href="{% static 'user/css/mobile/login.css' %}">
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <div class="logo">
                <div class="logo-icon">
                    <img src="https://i.ibb.co/G3WqN7N1/logo-barbearia-Photoroom.png" alt="logo do sistema" class="logo-image">
                </div>
                <h1>Orbly Barber</h1>
            </div>
        </div>
        
        <div class="login-body">
            <div class="body-top">
                <div class="welcome-title">
                    <h2>Bem-vindo</h2>
                    <p>Entre com sua conta para acessar o sistema</p>
                </div>
                
                {% if messages %}
                    {% for message in messages %}
                        {% if message.tags == 'error' %}
                            <div class="alert alert-{{ message.tags }}">
                                {{ message }}
                            </div>
                        {% endif %}
                    {% endfor %}
                {% endif %}

                <form id="loginForm" method="post">
                    {% csrf_token %}
                    <div class="form-area">
                        <div class="form-group">
                            <label class="form-label" for="email">
                                <i class="fas fa-envelope"></i> 
                                E-mail
                            </label>
                            <div class="input-icon">
                                <i class="fas fa-at"></i>
                            </div>
                            <input type="email" class="form-control" id="email" name="email" placeholder="seu@email.com" required>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label" for="password">
                                <i class="fas fa-lock"></i> 
                                Senha
                            </label>
                            <div class="input-icon">
                                <i class="fas fa-key"></i>
                            </div>
                            <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
                            <div class="password-toggle" id="togglePassword" onClick="showPassword()">
                                <i class="fas fa-eye"></i>
                            </div>
                        </div>
                        
                        <div class="remember-forgot">
                            <div class="remember-me">
                                <input type="checkbox" id="remember">
                                <label for="remember">Lembrar-me</label>
                            </div>
                            <a href="#" class="forgot-password">Esqueceu a senha?</a>
                        </div>
                    </div>

                    <button class="btn-login" type="submit">
                        <i class="fas fa-sign-in-alt"></i> Entrar
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script src="{% static 'user/js/login.js' %}"></script>

    <script>
        function showPassword() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.querySelector('#togglePassword i');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.classList.remove('fa-eye');
                toggleIcon.classList.add('fa-eye-slash'); // Ícone de olho cortado
            } else {
                passwordInput.type = 'password';
                toggleIcon.classList.remove('fa-eye-slash');
                toggleIcon.classList.add('fa-eye'); // Ícone de olho normal
            }
        }
    </script>
</body>
</html>
