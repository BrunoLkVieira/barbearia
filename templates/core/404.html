{% load static %}

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Não Encontrada</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1a2a6c, #2c3e50);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }

        .error-container {
            max-width: 600px;
            padding: 40px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .logo {
            width: 120px;
            height: 120px;
            margin: 0 auto 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            color: white;
            animation: horizontal-rotation 3s infinite linear;
        }

        .logo-image{
            width: 14rem;
        }

        @keyframes horizontal-rotation {
            0% {
                transform: rotateY(0deg);
            }
            100% {
                transform: rotateY(360deg);
            }
        }

        h1 {
            font-size: 6rem;
            margin-bottom: 10px;
            color: #FF7A00;
            text-shadow: 0 5px 15px rgba(255, 122, 0, 0.3);
        }

        h2 {
            font-size: 1.8rem;
            margin-bottom: 20px;
            font-weight: 500;
        }

        p {
            font-size: 1.1rem;
            margin-bottom: 30px;
            opacity: 0.9;
            line-height: 1.6;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 12px 30px;
            background: #FF7A00;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 122, 0, 0.3);
            border: none;
            cursor: pointer;
            font-size: 1rem;
        }

        .btn:hover {
            background: #e06a00;
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(255, 122, 0, 0.4);
        }

        .btn i {
            font-size: 1.1rem;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 4rem;
            }
            
            h2 {
                font-size: 1.5rem;
            }
            
            .logo {
                width: 100px;
                height: 100px;
                font-size: 2rem;
            }
        }

        /* Modal */
    .modal {
        display: none;
        position: fixed;
        z-index: 1000;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0,0,0,0.5);
    }

    .modal-content {
        background-color: #fff;
        margin: 10% auto;
        padding: 0;
        border-radius: 8px;
        width: 90%;
        max-width: 500px;
        color: #333;
    }

    .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 15px 20px;
        border-bottom: 1px solid #eaecef;
    }

    .modal-header h3 {
        margin: 0;
        color: #2c3e50;
    }

    .close-modal {
        font-size: 1.5rem;
        cursor: pointer;
    }

    .modal-body {
        padding: 20px;
    }

    .form-group {
        margin-bottom: 15px;
    }

    .form-group label {
        display: block;
        margin-bottom: 5px;
        font-weight: 500;
    }

    .form-group input, .form-group textarea {
        width: 100%;
        padding: 8px 12px;
        border: 1px solid #ddd;
        border-radius: 4px;
        font-size: 1rem;
    }

    .modal-footer {
        padding: 15px 20px;
        border-top: 1px solid #eaecef;
        display: flex;
        justify-content: flex-end;
        gap: 10px;
    }

    .btn-secondary {
        background: #6c757d;
        color: white;
    }

    .btn-primary {
        background: #FF7A00;
        color: white;
    }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="logo">
            <img src="https://i.ibb.co/G3WqN7N1/logo-barbearia-Photoroom.png" alt="logo do sistema" class="logo-image">
        </div>
        <h1>404</h1>
        <h2>Página Não Encontrada</h2>
        <p>Desculpe, a página que você está procurando não existe ou foi movida.</p>
        <button class="btn" onclick="openReportModal()">
            <i class="fas fa-bug"></i> Reportar Erro
        </button>
    </div>

    <!-- Modal para Reportar Erro -->
    <div id="reportModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Reportar Erro</h3>
                <span class="close-modal">&times;</span>
            </div>
            <div class="modal-body">
                <form id="reportForm" autocomplete="off">
                    <input type="hidden" id="error-type" value="404">
                    <div class="form-group">
                        <label for="user-email">Seu Email</label>
                        <input type="email" id="user-email" required placeholder="Seu email para contato">
                    </div>
                    <div class="form-group">
                        <label for="error-message">Mensagem (opcional)</label>
                        <textarea id="error-message" placeholder="Descreva o erro encontrado..."></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary close-modal">Cancelar</button>
                <button type="button" class="btn btn-primary" id="submitReport">Enviar</button>
            </div>
        </div>
    </div>
    <script>
    // Abrir modal
    function openReportModal() {
        document.getElementById('reportModal').style.display = 'block';
    }

    // Fechar modal
    document.querySelectorAll('.close-modal').forEach(button => {
        button.addEventListener('click', function() {
            document.getElementById('reportModal').style.display = 'none';
            document.getElementById('reportForm').reset();
        });
    });

    // Enviar report
    document.getElementById('submitReport').addEventListener('click', async function() {
        const userEmail = document.getElementById('user-email').value;
        const errorMessage = document.getElementById('error-message').value;
        const errorType = document.getElementById('error-type').value; // Pega o tipo de erro

        if (!userEmail) {
            alert('Por favor, preencha seu email.');
            return;
        }

        // Mostrar loading
        this.innerHTML = 'Enviando...';
        this.disabled = true;

        try {
            const response = await fetch('/report-error/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken'),
                },
                body: JSON.stringify({
                    email: userEmail,
                    message: errorMessage,
                    error_type: errorType, // Envia o tipo de erro
                }),
            });

            const data = await response.json();

            if (response.ok && data.status === 'success') {
                alert('Obrigado por reportar o erro! Nossa equipe será notificada.');
                document.getElementById('reportModal').style.display = 'none';
                document.getElementById('reportForm').reset();
            } else {
                alert('Erro ao enviar: ' + (data.message || 'Tente novamente.'));
            }
        } catch (error) {
            alert('Falha na conexão com o servidor.');
            console.error('Erro:', error);
        } finally {
            // Restaurar botão
            this.innerHTML = 'Enviar';
            this.disabled = false;
        }
    });

    // Função auxiliar para pegar CSRF token
    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }
    </script>
</body>
</html>
